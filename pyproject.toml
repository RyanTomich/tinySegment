[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinysegment"
version = "0.1.0"
description = "Editable, independent CLIP, YOLO-World and EfficientViT-SAM inference"
requires-python = ">=3.12"
dependencies = ["torch", "torchvision", "numpy", "pillow", "opencv-python", "pyyaml", "requests", "matplotlib", "psutil", "polars", "ultralytics-thop", "ftfy", "regex", "tqdm"]

[project.optional-dependencies]
speech = ["moonshine-voice==0.1.6"]

[project.scripts]
tinysegment = "tinysegment.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = [".", "src", "models/clip_vit_b32/baseline/upstream", "models/yolo_world_v2_small/baseline/upstream", "models/efficientvit_sam_l0/baseline/upstream"]
include = ["models", "models.*", "tinysegment*", "efficientvit*", "ultralytics*", "clip*", "segment_anything*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["manifest.json", "calibration.json", "README.md", "upstream/provenance.json", "upstream/source-hashes.json", "upstream/licenses/*/*", "upstream/licenses/*/licenses/*"]
clip = ["*.gz", "LICENSE"]
efficientvit = ["LICENSE"]
segment_anything = ["LICENSE"]
ultralytics = ["cfg/**/*.yaml", "cfg/*.yaml", "assets/*", "LICENSE"]
